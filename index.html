
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Think Cloud – Login</title>
  <link rel="stylesheet" href="styles.css?v=1">

</head>
<body>

  <div class="login-container">

    <!-- Cloud Logo -->
    <div class="logo">
      <svg width="70" height="70" viewBox="0 0 24 24" fill="#5d8dfd">
        <path d="M19 18H6a4 4 0 0 1-.4-7.99A5.5 5.5 0 0 1 16.5 7a5.48 5.48 0 0 1 4.39 2.21A4.5 4.5 0 0 1 19 18Z"/>
      </svg>
    </div>

    <h1>Think Cloud</h1>
    <p class="subtitle">Share your thoughts with those around you.</p>

    <!-- Email -->
    <div class="field-group">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="Email" required />
    </div>

    <!-- Password -->
    <div class="field-group">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="Password" required />
    </div>

    <button id="loginBtn" class="primary-btn">Log In</button>

    <p class="signup-text">
      New here?
      <a href="signup.html" class="signup-link">Create an account</a>
    </p>

  </div>

  <script>
    document.getElementById("loginBtn").onclick = () => {
      // simple demo login
      window.location.href = "map.html";
    };
  </script>

</body>
</html>
