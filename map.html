<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Think Cloud – Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Map UI styles -->
  <link rel="stylesheet" href="map.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding-bottom: 76px;
    }

    #map {
      height: calc(100vh - 76px);
      width: 100%;
      position: relative;
      z-index: 1;

    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Status Filter Button -->
<button id="filterBtn" class="filter-btn">Filters ⚙️</button>

<!-- Filter Panel -->
<div id="filterPanel" class="filter-panel">
  <h3>Show Clouds</h3>

  <label><input type="checkbox" class="status-filter" value="current" checked> Current</label>
  <label><input type="checkbox" class="status-filter" value="incoming" checked> Incoming</label>
  <label><input type="checkbox" class="status-filter" value="alumni" checked> Alumni</label>
  <label><input type="checkbox" class="status-filter" value="prospective" checked> Prospective</label>

  <button id="closeFilterBtn" class="close-filter-btn">Done</button>
</div>


  <!-- Comments popup overlay -->
  <div id="overlay" class="overlay-backdrop">
    <div class="comments-modal">
      <div class="comments-header">
        <div class="comments-header-main">
          <div>
            <div id="comments-pin-text" class="comments-title"></div>
            <div id="comments-meta" class="comments-meta"></div>
          </div>
          <button class="comments-close" id="closeOverlayBtn">✕</button>
        </div>
      </div>
      <div id="commentsList" class="comments-body"></div>

    <div class="comments-footer">
      <input id="newCommentInput" placeholder="Add a thought..." />
      <button id="postCommentBtn">Post</button>
    </div>
  </div>
</div>

<!-- Add Pin Panel (slide-up form) -->
<div id="addPinPanel" class="add-pin-panel">
  <div class="add-pin-title">Create Thought Cloud</div>

  <div id="addPinHint" class="add-pin-hint">
    Tap anywhere on the map to drop a pin.
  </div>

  <div id="addPinCoords" class="add-pin-coords">
    No location selected yet.
  </div>

  <textarea id="addPinText" placeholder="What's on your mind?"></textarea>

  <div class="add-pin-buttons">
    <button id="cancelAddPinBtn" class="cancel-btn">Cancel</button>
    <button id="savePinBtn" class="save-btn" disabled>Post</button>
  </div>
</div>

      <!-- Profile mini-card -->
<div id="profileCard" class="profile-card">

  <div id="profileAvatar" class="profile-avatar">🌿</div>

  <div class="profile-main">
    <div id="profileName" class="profile-name">Name</div>
    <div id="profileBio" class="profile-bio">Bio text...</div>
    <div id="profileYear" class="profile-year"></div>

    <!-- ACTION BUTTONS -->
    <div class="profile-actions">
      <button id="profileConnectBtn" class="connect-btn">Connect</button>
      <button id="profileMessageBtn" class="message-btn">Message</button>
    </div>
  </div>

  <!-- CLOSE BUTTON -->
  <button class="profile-close" onclick="hideProfile()">Close</button>

</div>


  <!-- Add Pin Button (floating + button) -->
<button id="addPinBtn" class="add-pin-btn">Drop a Thought</button>


  <!-- Bottom nav bar -->
  <nav class="bottom-nav">
    <a href="explore.html">
      <span class="icon">🧭</span>
      Explore
    </a>

    <a href="notifications.html">
      <span class="icon">🔔</span>
      Notifications
    </a>

    <a href="map.html" class="center-icon active">
      <span class="icon">🗺️</span>
      Map
    </a>

    <a href="chat.html">
      <span class="icon">💬</span>
      Chat
    </a>

    <a href="profile.html">
      <span class="icon">👤</span>
      Profile
    </a>
  </nav>

  <!-- UNIVERSAL MESSAGE MODAL (SMALL MAP VERSION) -->
<div id="globalMessageModal" class="mini-chat-modal">

  <!-- Header -->
  <div class="mini-chat-header">
    <div id="msgAvatar" class="mini-chat-avatar">💬</div>

    <div class="mini-chat-header-text">
      <div id="msgRecipient" class="mini-chat-name">User</div>
      <div id="msgMeta" class="mini-chat-meta">Last active recently</div>
    </div>

    <button id="msgCloseBtn" class="mini-chat-close">✕</button>
  </div>

  <!-- Scrollable Thread -->
  <div id="msgThread" class="mini-chat-thread"></div>

  <!-- Input -->
  <div class="mini-chat-input-row">
    <input id="msgInput" class="mini-chat-input" placeholder="Send a message…" />
    <button id="msgSendBtn" class="mini-chat-send-btn" disabled>Send</button>
  </div>

</div>


  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Global messag -->
  <script src="globalMessage.js"></script>

  <!-- Map logic -->
  <script src="map.js"></script>
</body>
</html>
