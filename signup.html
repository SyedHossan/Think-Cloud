<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Think Cloud – Sign up</title>
  <link rel="stylesheet" href="map.css">

</head>
<body>

  <div class="login-container">
    <!-- Cloud logo -->
    <div class="logo">
      <svg width="70" height="70" viewBox="0 0 24 24" fill="#5d8dfd">
        <path d="M19 18H6a4 4 0 0 1-.4-7.99A5.5 5.5 0 0 1 16.5 7a5.48 5.48 0 0 1 4.39 2.21A4.5 4.5 0 0 1 19 18Z"/>
      </svg>
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">
      Set up your profile so others can see who’s behind each cloud.
    </p>

    <form id="signupForm">
      <!-- First / Last name -->
      <div class="field-group">
        <label for="firstName">First name</label>
        <input id="firstName" class="text-input" type="text" required />
      </div>

      <div class="field-group">
        <label for="lastName">Last name</label>
        <input id="lastName" class="text-input" type="text" required />
      </div>

      <!-- School with autocomplete -->
      <div class="field-group">
        <label for="school">School</label>
        <input id="school" class="text-input" list="schoolList"
               placeholder="Start typing your school..." />
        <datalist id="schoolList">
          <option value="UTD – The University of Texas at Dallas">
          <option value="UNT – University of North Texas">
          <option value="UT Austin – The University of Texas at Austin">
          <option value="SMU – Southern Methodist University">
          <option value="TAMU – Texas A&amp;M University">
          <option value="UH – University of Houston">
          <option value="UCLA – University of California, Los Angeles">
          <option value="UCSD – University of California, San Diego">
          <option value="MIT – Massachusetts Institute of Technology">
          <option value="Harvard University">
          <option value="Stanford University">
          <option value="NYU – New York University">
          <option value="CMU – Carnegie Mellon University">
          <option value="Georgia Tech – Georgia Institute of Technology">
          <option value="UIUC – University of Illinois Urbana-Champaign">
        </datalist>
      </div>

      <!-- Major with autocomplete -->
      <div class="field-group">
        <label for="major">Major</label>
        <input id="major" class="text-input" list="majorList"
               placeholder="Start typing your major..." />
        <datalist id="majorList">
          <option value="Computer Science">
          <option value="Software Engineering">
          <option value="Data Science">
          <option value="Information Technology">
          <option value="Mechanical Engineering">
          <option value="Electrical Engineering">
          <option value="Civil Engineering">
          <option value="Biology">
          <option value="Neuroscience">
          <option value="Psychology">
          <option value="Child Development">
          <option value="Business Administration">
          <option value="Finance">
          <option value="Marketing">
          <option value="Design &amp; UX">
          <option value="Other / Undecided">
        </datalist>
      </div>

      <!-- Student status -->
      <div class="field-group">
        <label for="status">Student status</label>
        <select id="status" class="text-input">
          <option value="">Select your status</option>
          <option>Prospective</option>
          <option>Incoming</option>
          <option>Current</option>
          <option>Alumni</option>
        </select>
      </div>

      <!-- Country with autocomplete -->
      <div class="field-group">
        <label for="country">Home country</label>
        <input id="country" class="text-input" list="countryList"
               placeholder="Start typing your country..." />
        <datalist id="countryList">
          <option value="Australia">
          <option value="Brazil">
          <option value="Canada">
          <option value="China">
          <option value="Colombia">
          <option value="France">
          <option value="Germany">
          <option value="India">
          <option value="Ireland">
          <option value="Italy">
          <option value="Japan">
          <option value="Mexico">
          <option value="Netherlands">
          <option value="Nigeria">
          <option value="Pakistan">
          <option value="Singapore">
          <option value="South Korea">
          <option value="Spain">
          <option value="United Arab Emirates">
          <option value="United Kingdom">
          <option value="United States">
          <option value="Vietnam">
        </datalist>
      </div>

      <!-- Bio -->
      <div class="field-group">
        <label for="bio">Short bio (optional)</label>
        <textarea id="bio" class="text-input textarea"
                  placeholder="Tell others a bit about you (e.g., CS student who loves coffee walks)."></textarea>
      </div>

      <!-- Profile picture -->
      <div class="field-group">
        <label for="avatar">Profile picture (optional)</label>
        <input id="avatar" type="file" accept="image/*" />
      </div>

      <button type="submit" class="primary-btn">Create account</button>
    </form>

    <p class="signup-text">
      Already have an account?
      <a href="index.html">Back to login</a>
    </p>
  </div>

  <script>
    // Save basic profile to localStorage and go to map
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const profile = {
        firstName: "Anya",
        lastName: "Patel",
        school: "UTD – The University of Texas at Dallas",
        major: "Computer Science",
        status: "Current",
        country: "India",
        bio: "Incoming CS student who loves maps and chai 🌿"
      };

      localStorage.setItem("tc_currentUser", JSON.stringify(profile));
      window.location.href = "map.html";
    });
  </script>

</body>
</html>
