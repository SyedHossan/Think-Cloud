<!DOCTYPE html>
<html>
<head>
  <title>Create Cloud</title>
  <meta charset="UTF-8">
   <link rel="stylesheet" href="styles.css" />
  <style>
    body { padding: 20px; font-family: Arial; }
    textarea { width: 100%; height: 120px; padding: 10px; }
    button { margin-top: 12px; width: 100%; padding: 10px; }
  </style>
</head>
<body>

<h2>Create a Thought Cloud</h2>

<textarea id="thoughtInput" placeholder="What's on your mind?"></textarea>

<button onclick="saveCloud()">Post</button>

<script>
function saveCloud() {
  const thought = document.getElementById("thoughtInput").value.trim();
  if (!thought) return alert("Enter something first!");

  const newCloud = {
    id: "cloud" + Date.now(),
    lat: 32.985,
    lng: -96.752,
    text: thought,
    baseLikes: 0,
    liked: false,
    comments: []
  };

  let cloudList = JSON.parse(localStorage.getItem("userClouds") || "[]");
  cloudList.push(newCloud);
  localStorage.setItem("userClouds", JSON.stringify(cloudList));

  window.location.href = "map.html";
}
</script>

<script>
  function openMessageFromProfile(userId) {
      openConversation(userId); // opens big drawer
  }
</script>

</body>
</html>
